<style>
  :root {
    --bg: #000000;
    --surface: #0a0a0a;
    --border: rgba(255, 255, 255, 0.08);
    --hover: rgba(255, 255, 255, 0.05);
    --text-primary: #f5f5f7;
    --text-secondary: #86868b;
    --button-bg: #f5f5f7;
    --button-text: #000000;
    --danger: #ff6b6b;
    --success: #7fd68a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    height: 100%;
  }

  #root { min-height: 100vh; display: flex; }

  a { color: inherit; text-decoration: none; }

  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    background: none;
    color: inherit;
    font-size: 14px;
  }

  input, textarea, select {
    font-family: inherit;
    font-size: 15px;
    color: var(--text-primary);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    width: 100%;
    outline: none;
    transition: border-color 180ms ease;
  }
  input:focus, textarea:focus, select:focus { border-color: rgba(255,255,255,0.25); }
  input::placeholder, textarea::placeholder { color: var(--text-secondary); }

  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 10px; }

  /* ---------- Layout ---------- */

  .sidebar {
    width: 220px;
    flex-shrink: 0;
    border-right: 1px solid var(--border);
    padding: 28px 20px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }
  .sidebar .brand { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; padding: 0 8px; }
  .sidebar nav { display: flex; flex-direction: column; gap: 2px; }
  .sidebar nav a, .sidebar nav button {
    display: block;
    width: 100%;
    text-align: left;
    padding: 9px 10px;
    border-radius: 8px;
    font-size: 14px;
    color: var(--text-secondary);
    transition: background 180ms ease, color 180ms ease;
  }
  .sidebar nav a:hover, .sidebar nav button:hover { background: var(--hover); color: var(--text-primary); }
  .sidebar nav a.active { background: var(--hover); color: var(--text-primary); }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    display: none;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  .content {
    flex: 1;
    padding: 40px 48px 100px;
    max-width: 780px;
    width: 100%;
    margin: 0 auto;
    animation: fadeIn 220ms ease;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  .mobile-nav {
    display: none;
    position: fixed;
    bottom: 0; left: 0; right: 0;
    border-top: 1px solid var(--border);
    background: rgba(0,0,0,0.9);
    backdrop-filter: blur(12px);
    padding: 10px 6px calc(10px + env(safe-area-inset-bottom));
    justify-content: space-around;
    z-index: 20;
  }
  .mobile-nav a {
    font-size: 11px;
    color: var(--text-secondary);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
  }
  .mobile-nav a.active { color: var(--text-primary); }

  @media (max-width: 860px) {
    .sidebar { display: none; }
    .topbar { display: flex; }
    .mobile-nav { display: flex; }
    .content { padding: 24px 20px 96px; }
  }

  /* ---------- Typography ---------- */

  h1.page-title { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 4px; }
  p.page-subtitle { color: var(--text-secondary); font-size: 15px; margin: 0 0 28px; }
  h2.section-title { font-size: 17px; font-weight: 600; margin: 0 0 4px; }
  label.field-label { display: block; font-size: 13px; color: var(--text-secondary); margin: 20px 0 8px; }
  label.field-label:first-child { margin-top: 0; }

  /* ---------- Rows / lists ---------- */

  .row-list { border-top: 1px solid var(--border); }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 20px 4px;
    border-bottom: 1px solid var(--border);
    transition: background 180ms ease;
  }
  a.row, button.row { width: 100%; text-align: left; border-radius: 10px; padding: 20px 12px; }
  a.row:hover, button.row:hover { background: var(--hover); }

  .row-main { min-width: 0; }
  .row-title { font-size: 16px; font-weight: 500; }
  .row-sub { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
  .row-meta { display: flex; gap: 40px; }
  .row-meta .meta-block .meta-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 3px; }
  .row-meta .meta-block .meta-value { font-size: 14px; }
  .row-chevron { color: var(--text-secondary); font-size: 15px; flex-shrink: 0; }

  @media (max-width: 600px) {
    .row-meta { flex-direction: column; gap: 8px; }
  }

  /* ---------- Buttons ---------- */

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 11px 18px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    transition: opacity 180ms ease, background 180ms ease;
  }
  .btn-primary { background: var(--button-bg); color: var(--button-text); }
  .btn-primary:hover { opacity: 0.85; }
  .btn-primary:disabled { opacity: 0.4; cursor: default; }
  .btn-secondary { background: var(--surface); color: var(--text-primary); border: 1px solid var(--border); }
  .btn-secondary:hover { background: var(--hover); }
  .btn-danger { color: var(--danger); }
  .btn-block { width: 100%; justify-content: center; }

  /* ---------- Header row with action ---------- */

  .page-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
  }

  /* ---------- Cards / panels ---------- */

  .panel { border: 1px solid var(--border); border-radius: 14px; padding: 24px; margin-bottom: 20px; }

  .empty-state { padding: 48px 4px; text-align: center; }
  .empty-state .empty-title { font-size: 16px; font-weight: 500; margin-bottom: 6px; }
  .empty-state .empty-sub { font-size: 14px; color: var(--text-secondary); margin-bottom: 20px; }

  /* ---------- Upload dropzone ---------- */

  .dropzone {
    border: 1px dashed var(--border);
    border-radius: 14px;
    padding: 36px 20px;
    text-align: center;
    color: var(--text-secondary);
    font-size: 14px;
    cursor: pointer;
    transition: background 180ms ease, border-color 180ms ease;
  }
  .dropzone:hover, .dropzone.dragover { background: var(--hover); border-color: rgba(255,255,255,0.2); }
  .dropzone .dz-main { color: var(--text-primary); font-size: 15px; margin-bottom: 4px; }

  .file-chip {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 14px;
  }
  .file-chip .fc-name { font-weight: 500; }
  .file-chip .fc-size { color: var(--text-secondary); font-size: 12px; margin-top: 2px; }

  /* ---------- Toggle ---------- */

  .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; }
  .switch { position: relative; width: 42px; height: 24px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .track {
    position: absolute; inset: 0; background: rgba(255,255,255,0.15); border-radius: 999px;
    transition: background 180ms ease; cursor: pointer;
  }
  .switch .track::before {
    content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px;
    background: #fff; border-radius: 50%; transition: transform 180ms ease;
  }
  .switch input:checked + .track { background: #f5f5f7; }
  .switch input:checked + .track::before { transform: translateX(18px); background: #000; }

  /* ---------- Badges / status ---------- */

  .badge { font-size: 12px; color: var(--text-secondary); border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; }
  .badge-admin { color: var(--text-primary); }

  /* ---------- Login ---------- */

  .login-screen {
    min-height: 100vh; width: 100%; display: flex; align-items: center; justify-content: center;
    flex-direction: column; text-align: center; padding: 20px;
  }
  .login-screen .brand { font-size: 34px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 10px; }
  .login-screen .tagline { color: var(--text-secondary); font-size: 15px; margin-bottom: 36px; }
  .login-screen .footnote { color: var(--text-secondary); font-size: 12px; margin-top: 40px; }

  /* ---------- Toast ---------- */

  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 12px);
    background: var(--surface); border: 1px solid var(--border); color: var(--text-primary);
    padding: 12px 18px; border-radius: 10px; font-size: 14px; opacity: 0;
    transition: opacity 200ms ease, transform 200ms ease; pointer-events: none; z-index: 50;
    max-width: 360px; text-align: center;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- Modal ---------- */

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center;
    justify-content: center; z-index: 40; padding: 20px; animation: fadeIn 180ms ease;
  }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 28px; width: 100%; max-width: 420px; }

  .spinner {
    width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.25); border-top-color: #fff;
    border-radius: 50%; animation: spin 700ms linear infinite; display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .text-muted { color: var(--text-secondary); }
  .mt-8 { margin-top: 8px; } .mt-16 { margin-top: 16px; } .mt-24 { margin-top: 24px; }
</style>
